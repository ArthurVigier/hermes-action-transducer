[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-action-transducer"
version = "0.1.0"
description = "Hermes-centered action IR and embodiment compiler for robot runtimes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.1"]
convert = ["datasets>=2.19", "huggingface_hub>=0.23"]
hermes = ["torch>=2.1", "transformers>=4.48", "accelerate>=0.34", "sentencepiece>=0.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
